services:
  postgres:
    image: postgres:16-alpine
    container_name: cota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cota}
      POSTGRES_DB: ${POSTGRES_DB:-cota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cota} -d ${POSTGRES_DB:-cota}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
